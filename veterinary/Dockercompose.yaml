
name: veterinaria

services:

  # 1. Base de datos MySQL
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_unab}
      MYSQL_USER: ${MYSQL_USER:-veterinary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - veterinary-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # 2. Migraciones de la base de datos
  flyway:
    image: flyway/flyway:10
    command: migrate
    restart: "no"
    environment:
      FLYWAY_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE:-db_unab}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      FLYWAY_USER: ${MYSQL_USER:-veterinary}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "30"
    volumes:
      - ./veterinary-system-db/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - veterinary-network

  # 3. Backend Spring Boot
  api:
    build:
      context: ./veterinary-system-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE:-db_unab}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-veterinary}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    expose:
      - "9090"
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      veterinary-network:
        aliases:
          - veterinary-system-api
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9090'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # 4. Frontend Angular + Nginx
  portal:
    build:
      context: ./veterinary-system-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND_ADDRESS:-127.0.0.1}:${PORTAL_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - veterinary-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  veterinary-network:
    driver: bridge

volumes:
  mysql_data:
